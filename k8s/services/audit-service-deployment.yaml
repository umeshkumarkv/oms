apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
  namespace: broker-dealer-poc
  labels:
    app: audit-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-service
  template:
    metadata:
      labels:
        app: audit-service
    spec:
      containers:
        - name: audit-service
          image: umeshkumarkv/audit-service:latest
          ports:
            - containerPort: 8087
          envFrom:
            - configMapRef:
                name: broker-dealer-config
            - secretRef:
                name: broker-dealer-secret
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-service:5432/brokerdealer?currentSchema=audit_schema"
            - name: SPRING_DATASOURCE_USERNAME
              value: "brokerdealer"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8087
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8087
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
