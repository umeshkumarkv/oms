apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: broker-dealer-poc
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: umeshkumarkv/notification-service:latest
          ports:
            - containerPort: 8088
          envFrom:
            - configMapRef:
                name: broker-dealer-config
            - secretRef:
                name: broker-dealer-secret
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8088
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8088
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"