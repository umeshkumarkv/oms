openapi: 3.0.3
info:
  title: Execution Service API
  description: Mock fill engine and execution records for Broker Dealer OMS
  version: 1.0.0

servers:
  - url: http://localhost:8086
    description: Local development

paths:
  /api/v1/executions/{orderId}:
    get:
      summary: Get executions for an order
      operationId: getExecutionsByOrderId
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of executions for the order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionListResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: ORDER_NOT_FOUND
                  message: No executions found for order
                  details: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ExecutionDetail:
      type: object
      properties:
        executionId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        symbol:
          type: string
        side:
          type: string
          enum: [BUY, SELL]
        executedQty:
          type: integer
        executedPrice:
          type: string
          description: BigDecimal as string
          example: "175.50"
        fillType:
          type: string
          enum: [FULL, PARTIAL]
          example: FULL
        fillValue:
          type: string
          description: BigDecimal as string — executedQty × executedPrice
          example: "17550.00"
        remainingQuantity:
          type: integer
          example: 0
        marketPriceAtFill:
          type: string
          description: BigDecimal as string — market price at time of fill
          example: "175.50"
        executionVenue:
          type: string
          example: MOCK_ECN
        executedAt:
          type: string
          format: date-time

    ExecutionListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ExecutionDetail'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    ResponseMeta:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
          format: uuid

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'