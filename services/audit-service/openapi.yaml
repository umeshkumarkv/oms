openapi: 3.0.3
info:
  title: Audit Service API
  description: Immutable audit trail for all order state changes in Broker Dealer OMS
  version: 1.0.0

servers:
  - url: http://localhost:8087
    description: Local development

paths:
  /api/v1/audit/orders/{id}:
    get:
      summary: Get audit trail for a specific order
      operationId: getOrderAuditTrail
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Audit trail for the order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditTrailResponse'
        '404':
          description: Order not found in audit trail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: ORDER_NOT_FOUND
                  message: No audit records found for order
                  details: []

  /api/v1/audit/trail:
    get:
      summary: Query audit trail with filters
      operationId: getAuditTrail
      security:
        - bearerAuth: []
      parameters:
        - name: clientId
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: entityType
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated audit records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditTrailResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AuditRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        entityType:
          type: string
        entityId:
          type: string
          format: uuid
        previousState:
          type: string
          nullable: true
        newState:
          type: string
        actorId:
          type: string
          format: uuid
          nullable: true
        actorType:
          type: string
          enum: [USER, SYSTEM]
        eventTimestamp:
          type: string
          format: date-time
        metadata:
          type: string
          nullable: true

    AuditTrailResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditRecord'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    ResponseMeta:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
          format: uuid

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'