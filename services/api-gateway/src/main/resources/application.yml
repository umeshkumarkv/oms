spring:
  application:
    name: api-gateway
  threads:
    virtual:
      enabled: true
  cloud:
    gateway:
      mvc:
        routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/v1/auth/**
        - id: auth-service-users
          uri: http://auth-service:8081
          predicates:
            - Path=/api/v1/users/**
        - id: order-service
          uri: http://order-service:8082
          predicates:
            - Path=/api/v1/orders/**
        - id: order-service-dashboard
          uri: http://order-service:8082
          predicates:
            - Path=/api/v1/dashboard/**
        - id: client-service
          uri: http://client-service:8083
          predicates:
            - Path=/api/v1/clients/**
        - id: marketdata-service
          uri: http://marketdata-service:8084
          predicates:
            - Path=/api/v1/market/**
        - id: marketdata-service-watchlist
          uri: http://marketdata-service:8084
          predicates:
            - Path=/api/v1/watchlists/**
        - id: risk-service
          uri: http://risk-service:8085
          predicates:
            - Path=/api/v1/risk/**
        - id: execution-service
          uri: http://execution-service:8086
          predicates:
            - Path=/api/v1/executions/**
        - id: audit-service
          uri: http://audit-service:8087
          predicates:
            - Path=/api/v1/audit/**
        - id: notification-service
          uri: http://notification-service:8088
          predicates:
            - Path=/api/v1/notifications/**

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 2000ms

server:
  port: 9090

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL:http://notification-service:8088}
  stream:
    connect-timeout-ms: 5000

logging:
  level:
    com.brokerdealer: INFO
    org.springframework.cloud.gateway: WARN
