openapi: 3.0.3
info:
  title: Risk Service API
  description: Configurable risk rule engine for Broker Dealer OMS
  version: 1.0.0

servers:
  - url: http://localhost:8085
    description: Local development

paths:
  /api/v1/risk/rules:
    get:
      summary: List all risk rules
      operationId: getRiskRules
      security:
        - bearerAuth: []
      parameters:
        - name: X-User-Role
          in: header
          required: true
          schema:
            type: string
            enum: [ADMIN]
      responses:
        '200':
          description: List of risk rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskRuleListResponse'
        '401':
          description: Missing role header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Role not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: FORBIDDEN
                  message: Role TRADER is not permitted to GET /api/v1/risk/rules
                  details: []

  /api/v1/risk/rules/{ruleCode}:
    patch:
      summary: Update a risk rule configuration
      operationId: updateRiskRule
      security:
        - bearerAuth: []
      parameters:
        - name: ruleCode
          in: path
          required: true
          schema:
            type: string
        - name: X-User-Role
          in: header
          required: true
          schema:
            type: string
            enum: [ADMIN]
        - name: X-User-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
          description: User ID forwarded by gateway — recorded as changedBy in audit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRiskRuleRequest'
            example:
              enabled: true
              changeReason: "Enabling for demo"
      responses:
        '200':
          description: Risk rule updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskRuleResponse'
        '400':
          description: Validation error — changeReason missing or blank
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: changeReason is required
                  details: []
        '404':
          description: Rule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: RULE_NOT_FOUND
                  message: Risk rule not found
                  details: []

  /api/v1/risk/rules/audit:
    get:
      summary: Get risk rule change audit log
      operationId: getRiskRuleAuditLog
      security:
        - bearerAuth: []
      parameters:
        - name: X-User-Role
          in: header
          required: true
          schema:
            type: string
            enum: [ADMIN]
      responses:
        '200':
          description: Audit log ordered by changedAt descending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskRuleAuditListResponse'
        '403':
          description: Role not permitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RiskRule:
      type: object
      properties:
        ruleCode:
          type: string
          example: SINGLE_ORDER_QTY_LIMIT
        ruleName:
          type: string
          example: Single Order Quantity Limit
        ruleCategory:
          type: string
          example: FINANCIAL_LIMIT
        description:
          type: string
        enabled:
          type: boolean
        thresholdValue:
          type: string
          nullable: true
          example: "10000.0000"
        thresholdUnit:
          type: string
          nullable: true
          example: QUANTITY
        action:
          type: string
          example: REJECT
        priority:
          type: integer
          example: 1

    RiskRuleListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RiskRule'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    RiskRuleResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/RiskRule'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    UpdateRiskRuleRequest:
      type: object
      required:
        - changeReason
      properties:
        enabled:
          type: boolean
          nullable: true
        thresholdValue:
          type: string
          nullable: true
          description: BigDecimal string representation
        changeReason:
          type: string
          description: Mandatory reason for the change — recorded in audit log

    RiskRuleAuditEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ruleCode:
          type: string
        fieldChanged:
          type: string
          example: enabled
        oldValue:
          type: string
          nullable: true
          example: "false"
        newValue:
          type: string
          nullable: true
          example: "true"
        changedBy:
          type: string
          example: "admin-user-uuid"
        changeReason:
          type: string
          example: "Enabling for demo"
        changedAt:
          type: string
          format: date-time

    RiskRuleAuditListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RiskRuleAuditEntry'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    ResponseMeta:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
          format: uuid

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
