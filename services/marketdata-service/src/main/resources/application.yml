spring:
  threads:
    virtual:
      enabled: true
  application:
    name: marketdata-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME:brokerdealer}
    password: ${SPRING_DATASOURCE_PASSWORD:brokerdealer}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: market_schema
        format_sql: false
  flyway:
    schemas: market_schema
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: marketdata-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.brokerdealer.*
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 2000ms

market:
  hours:
    open-time: "00:30:00"
    close-time: "23:59:00"
    timezone: "America/New_York"
  polling:
    interval-ms: 5000
  simulation:
    bypass-market-hours: true
  scenarios:
    items:
      "[SCN-AAPL-DROP-5PCT]":
        symbol: AAPL
        direction-pct: "-5"
        ticks: 10
      "[SCN-AAPL-RISE-5PCT]":
        symbol: AAPL
        direction-pct: "5"
        ticks: 10
      "[SCN-TSLA-DROP-5PCT]":
        symbol: TSLA
        direction-pct: "-5"
        ticks: 10
      "[SCN-TSLA-RISE-5PCT]":
        symbol: TSLA
        direction-pct: "5"
        ticks: 10
      "[SCN-MSFT-RISE-3PCT]":
        symbol: MSFT
        direction-pct: "3"
        ticks: 6

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

resilience4j:
  circuitbreaker:
    instances:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    instances:
      default:
        timeout-duration: 2s

logging:
  level:
    com.brokerdealer: INFO
    org.springframework.kafka: WARN
