openapi: 3.0.3
info:
  title: Market Data Service API
  description: Mock market prices, instrument data, and market hours for Broker Dealer OMS
  version: 1.0.0

servers:
  - url: http://localhost:8084
    description: Local development

paths:
  /api/v1/market/{symbol}:
    get:
      summary: Get instrument data by symbol
      operationId: getInstrument
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
            maxLength: 20
      responses:
        '200':
          description: Instrument data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentResponse'
        '404':
          description: Symbol not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: SYMBOL_NOT_FOUND
                  message: Symbol not found
                  details: []

  /api/v1/market/hours:
    get:
      summary: Get current market hours status
      operationId: getMarketHours
      responses:
        '200':
          description: Market hours status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketHoursResponse'

  /api/v1/market/movers:
    get:
      summary: Get top market movers (gainers and losers by % change from open price)
      operationId: getMarketMovers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Top 5 gainers and losers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketMoversResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/market/instruments:
    get:
      summary: List all instruments
      operationId: getInstruments
      responses:
        '200':
          description: List of instruments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentListResponse'

  /api/v1/watchlist:
    get:
      summary: Get current user's watchlist
      operationId: getWatchlist
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User watchlist entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/watchlist/{symbol}:
    post:
      summary: Add symbol to watchlist
      operationId: addToWatchlist
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
            maxLength: 20
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Symbol added to watchlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistEntryResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Symbol not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: SYMBOL_NOT_FOUND
                  message: Symbol not found
        '409':
          description: Symbol already in watchlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: SYMBOL_ALREADY_IN_WATCHLIST
                  message: Symbol is already in watchlist
        '422':
          description: Watchlist limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: WATCHLIST_LIMIT_EXCEEDED
                  message: Watchlist limit of 50 symbols reached
    delete:
      summary: Remove symbol from watchlist
      operationId: removeFromWatchlist
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Symbol removed from watchlist
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Symbol not in watchlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: SYMBOL_NOT_IN_WATCHLIST
                  message: Symbol is not in watchlist

components:
  schemas:
    InstrumentDetail:
      type: object
      properties:
        symbol:
          type: string
        bidPrice:
          type: string
        askPrice:
          type: string
        lastPrice:
          type: string
        tradable:
          type: boolean
        halted:
          type: boolean
        minQuantity:
          type: integer
        maxQuantity:
          type: integer
        dataTimestamp:
          type: string
          format: date-time

    InstrumentResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/InstrumentDetail'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    InstrumentSummary:
      type: object
      properties:
        symbol:
          type: string
        tradable:
          type: boolean
        halted:
          type: boolean

    InstrumentListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/InstrumentSummary'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    MarketHoursResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            marketOpen:
              type: boolean
            openTime:
              type: string
              example: "09:30"
            closeTime:
              type: string
              example: "16:00"
            timezone:
              type: string
              example: "America/New_York"
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    ResponseMeta:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
          format: uuid

    MoverEntry:
      type: object
      properties:
        symbol:
          type: string
          example: "NVDA"
        percentChange:
          type: string
          description: BigDecimal 2dp — positive for gainers, negative for losers
          example: "3.21"

    MarketMoversResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            gainers:
              type: array
              items:
                $ref: '#/components/schemas/MoverEntry'
              maxItems: 5
            losers:
              type: array
              items:
                $ref: '#/components/schemas/MoverEntry'
              maxItems: 5
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'