openapi: 3.0.3
info:
  title: Client Service API
  description: Client profiles, portfolio management and cash reservations for Broker Dealer OMS
  version: 1.0.0

servers:
  - url: http://localhost:8083
    description: Local development

paths:
  /api/v1/clients/active:
    get:
      summary: Get top N active clients ranked by today's turnover (OPERATIONS and ADMIN only)
      operationId: getActiveClients
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
          description: Maximum number of clients to return (default 10, max 50)
      responses:
        '200':
          description: Ranked active clients
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveClientsResponse'
        '400':
          description: Invalid limit parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: VALIDATION_ERROR
                  message: limit must be between 1 and 50
                  details: []
        '401':
          description: Unauthorized — X-User-Role header missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — OPERATIONS or ADMIN role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/clients/{id}:
    get:
      summary: Get client profile by ID
      operationId: getClient
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Client profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '404':
          description: Client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: CLIENT_NOT_FOUND
                  message: Client not found
                  details: []

  /api/v1/clients/{id}/portfolio:
    get:
      summary: Get client portfolio including cash and holdings
      operationId: getPortfolio
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Client portfolio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioResponse'
        '404':
          description: Client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/clients/{id}/default-route:
    patch:
      summary: Update client default route (ADMIN only)
      operationId: updateDefaultRoute
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDefaultRouteRequest'
      responses:
        '200':
          description: Default route updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateDefaultRouteResponse'
        '400':
          description: Invalid route value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_ROUTE
                  message: "Invalid route value: LONDON. Valid values: NASDAQ, NYSE, ARCA, BATS"
                  details: []
        '403':
          description: Forbidden — ADMIN role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/clients/{id}/reserved-cash:
    patch:
      summary: Adjust client reserved cash
      operationId: adjustReservedCash
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservedCashRequest'
      responses:
        '200':
          description: Reserved cash updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservedCashResponse'
        '404':
          description: Client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ClientResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            clientId:
              type: string
              format: uuid
            name:
              type: string
            status:
              type: string
              enum: [ACTIVE, BLOCKED]
            tradingEnabled:
              type: boolean
            kycStatus:
              type: string
              enum: [VERIFIED, PENDING, EXPIRED]
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    HoldingDetail:
      type: object
      properties:
        symbol:
          type: string
        quantity:
          type: integer
        avgPrice:
          type: string
        currentPrice:
          type: string
        marketValue:
          type: string

    PortfolioResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            clientId:
              type: string
              format: uuid
            defaultRoute:
              type: string
              enum: [NASDAQ, NYSE, ARCA, BATS]
            cashBalance:
              type: string
            reservedCash:
              type: string
            buyingPower:
              type: string
            holdings:
              type: array
              items:
                $ref: '#/components/schemas/HoldingDetail'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    UpdateDefaultRouteRequest:
      type: object
      required: [defaultRoute]
      properties:
        defaultRoute:
          type: string
          enum: [NASDAQ, NYSE, ARCA, BATS]

    UpdateDefaultRouteResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            clientId:
              type: string
              format: uuid
            defaultRoute:
              type: string
              enum: [NASDAQ, NYSE, ARCA, BATS]
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    ReservedCashRequest:
      type: object
      required: [adjustment, reason]
      properties:
        adjustment:
          type: string
          description: BigDecimal as string — positive to reserve, negative to release
        reason:
          type: string

    ReservedCashResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            clientId:
              type: string
              format: uuid
            reservedCash:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    ActiveClientResponse:
      type: object
      properties:
        clientId:
          type: string
          format: uuid
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        clientName:
          type: string
          example: "Acme Capital"
        turnoverToday:
          type: string
          description: BigDecimal as string — today's executed fill value
          example: "125000.00"
        availableCash:
          type: string
          description: BigDecimal as string — cashBalance minus reservedCash
          example: "48500.00"

    ActiveClientsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ActiveClientResponse'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    ResponseMeta:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
          format: uuid

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'