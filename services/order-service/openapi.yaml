openapi: 3.0.3
info:
  title: Order Service API
  description: Order entry, lifecycle management and state machine for Broker Dealer OMS
  version: 1.0.0

servers:
  - url: http://localhost:8082
    description: Local development

paths:
  /api/v1/orders:
    post:
      summary: Submit a new equity order
      operationId: submitOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitOrderRequest'
      responses:
        '202':
          description: Order accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitOrderResponse'
        '400':
          description: Level 1 validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_ERROR:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: quantity must be greater than 0
                      details:
                        - field: quantity
                          code: VALIDATION_ERROR
                          message: quantity must be greater than 0
                INVALID_ORDER_SIDE:
                  value:
                    error:
                      code: INVALID_ORDER_SIDE
                      message: "Invalid side: must be BUY, SELL, or SHORT_SELL"
                      details: []
        '422':
          description: Level 2 semantic validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                CLIENT_NOT_FOUND:
                  value:
                    error:
                      code: CLIENT_NOT_FOUND
                      message: Client not found
                      details: []
                MARKET_CLOSED:
                  value:
                    error:
                      code: MARKET_CLOSED
                      message: Market is closed
                      details: []
                INSUFFICIENT_BUYING_POWER:
                  value:
                    error:
                      code: INSUFFICIENT_BUYING_POWER
                      message: Insufficient buying power for this order
                      details: []
                SYMBOL_HALTED:
                  value:
                    error:
                      code: SYMBOL_HALTED
                      message: Trading is halted for this symbol
                      details: []
                DUPLICATE_ORDER:
                  value:
                    error:
                      code: DUPLICATE_ORDER
                      message: Duplicate order detected within 30 seconds
                      details: []
                SELF_TRADE:
                  value:
                    error:
                      code: SELF_TRADE
                      message: Order would create a self-trade
                      details: []
                INSUFFICIENT_HOLDINGS:
                  value:
                    error:
                      code: INSUFFICIENT_HOLDINGS
                      message: Insufficient holdings for SELL order
                      details: []

    get:
      summary: List orders with optional filters
      operationId: getOrders
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [NEW, VALIDATED, RISK_CHECK_PASSED, RISK_REJECTED, ACCEPTED,
                   SENT_TO_EXECUTION, PARTIALLY_FILLED, FILLED, CANCELLED, REJECTED, EXPIRED]
        - name: clientId
          in: query
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'

  /api/v1/orders/{id}:
    get:
      summary: Get order by ID
      operationId: getOrderById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: ORDER_NOT_FOUND
                  message: Order not found
                  details: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SubmitOrderRequest:
      type: object
      required: [clientOrderId, clientId, symbol, side, orderType, timeInForce, quantity]
      properties:
        clientOrderId:
          type: string
          maxLength: 100
        clientId:
          type: string
          format: uuid
        symbol:
          type: string
          maxLength: 20
          pattern: '^[A-Z0-9]+$'
        side:
          type: string
          enum: [BUY, SELL, SHORT_SELL]
        orderType:
          type: string
          enum: [MARKET, LIMIT]
        timeInForce:
          type: string
          enum: [DAY, GTC]
        quantity:
          type: integer
          minimum: 1
        limitPrice:
          type: string
          description: Required for LIMIT orders. BigDecimal as string.
        expiryDate:
          type: string
          format: date
          description: Optional for GTC orders. Defaults to 180 days.
        routingDestination:
          type: string
          description: "Execution venue for this order. Defaults to NYSE if not provided."
          example: "NYSE"
          enum: [NYSE, NASDAQ, ARCA, BATS, DARK_POOL]

    SubmitOrderResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            orderId:
              type: string
              format: uuid
            status:
              type: string
              enum: [NEW]
            expiryDate:
              type: string
              format: date
            expiryApplied:
              type: string
              enum: [DEFAULT, TRADER]
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    OrderSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        clientOrderId:
          type: string
        clientId:
          type: string
          format: uuid
        symbol:
          type: string
        side:
          type: string
          enum: [BUY, SELL, SHORT_SELL]
        orderType:
          type: string
          enum: [MARKET, LIMIT]
        timeInForce:
          type: string
          enum: [DAY, GTC]
        quantity:
          type: integer
        limitPrice:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        routingDestination:
          type: string
          description: "Execution venue this order was directed to."
          example: "NYSE"

    OrderListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OrderSummary'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    OrderDetailResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/OrderSummary'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    ResponseMeta:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
          format: uuid

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                    example: quantity
                  code:
                    type: string
                    example: VALIDATION_ERROR
                  message:
                    type: string
                    example: quantity must be greater than 0
        meta:
          $ref: '#/components/schemas/ResponseMeta'