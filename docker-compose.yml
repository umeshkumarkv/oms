version: "3.9"

services:
  # ─── Infrastructure ────────────────────────────────────────────────────────

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - broker-dealer-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CREATE_TOPICS: >-
        order.state.changed:1:1,
        risk.evaluation.requested:1:1,
        risk.evaluation.result:1:1,
        order.execution.requested:1:1,
        execution.completed:1:1,
        order.state.changed.DLT:1:1,
        risk.evaluation.requested.DLT:1:1,
        execution.completed.DLT:1:1
    networks:
      - broker-dealer-net

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - broker-dealer-net

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: brokerdealer
      POSTGRES_USER: brokerdealer
      POSTGRES_PASSWORD: brokerdealer
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - broker-dealer-net

  # ─── Application Services ──────────────────────────────────────────────────

  api-gateway:
    image: umeshkumarkv/api-gateway:latest
    container_name: api-gateway
    build:
      context: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_DATASOURCE_USERNAME: brokerdealer
      SPRING_DATASOURCE_PASSWORD: brokerdealer
      JWT_SECRET: dev-secret-key-change-in-production-min-32-chars
    depends_on:
      - kafka
      - redis
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - broker-dealer-net

  auth-service:
    image: umeshkumarkv/auth-service:latest
    container_name: auth-service
    build:
      context: ./services/auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_DATASOURCE_USERNAME: brokerdealer
      SPRING_DATASOURCE_PASSWORD: brokerdealer
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/brokerdealer?currentSchema=auth_schema
      JWT_SECRET: dev-secret-key-change-in-production-min-32-chars
    depends_on:
      - kafka
      - redis
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - broker-dealer-net

  order-service:
    image: umeshkumarkv/order-service:latest
    container_name: order-service
    build:
      context: ./services/order-service
    ports:
      - "8082:8082"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_DATASOURCE_USERNAME: brokerdealer
      SPRING_DATASOURCE_PASSWORD: brokerdealer
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/brokerdealer?currentSchema=order_schema
      JWT_SECRET: dev-secret-key-change-in-production-min-32-chars
    depends_on:
      - kafka
      - redis
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - broker-dealer-net

  client-service:
    image: umeshkumarkv/client-service:latest
    container_name: client-service
    build:
      context: ./services/client-service
    ports:
      - "8083:8083"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_DATASOURCE_USERNAME: brokerdealer
      SPRING_DATASOURCE_PASSWORD: brokerdealer
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/brokerdealer?currentSchema=client_schema
      JWT_SECRET: dev-secret-key-change-in-production-min-32-chars
    depends_on:
      - kafka
      - redis
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - broker-dealer-net

  marketdata-service:
    image: umeshkumarkv/marketdata-service:latest
    container_name: marketdata-service
    build:
      context: ./services/marketdata-service
    ports:
      - "8084:8084"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_DATASOURCE_USERNAME: brokerdealer
      SPRING_DATASOURCE_PASSWORD: brokerdealer
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/brokerdealer?currentSchema=market_schema
      JWT_SECRET: dev-secret-key-change-in-production-min-32-chars
    depends_on:
      - kafka
      - redis
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - broker-dealer-net

  risk-service:
    image: umeshkumarkv/risk-service:latest
    container_name: risk-service
    build:
      context: ./services/risk-service
    ports:
      - "8085:8085"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_DATASOURCE_USERNAME: brokerdealer
      SPRING_DATASOURCE_PASSWORD: brokerdealer
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/brokerdealer?currentSchema=risk_schema
      JWT_SECRET: dev-secret-key-change-in-production-min-32-chars
    depends_on:
      - kafka
      - redis
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - broker-dealer-net

  execution-service:
    image: umeshkumarkv/execution-service:latest
    container_name: execution-service
    build:
      context: ./services/execution-service
    ports:
      - "8086:8086"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_DATASOURCE_USERNAME: brokerdealer
      SPRING_DATASOURCE_PASSWORD: brokerdealer
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/brokerdealer?currentSchema=execution_schema
      JWT_SECRET: dev-secret-key-change-in-production-min-32-chars
    depends_on:
      - kafka
