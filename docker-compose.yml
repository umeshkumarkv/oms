    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - broker-dealer-net

volumes:
  postgres-data:

networks:
  broker-dealer-net:
    driver: bridge