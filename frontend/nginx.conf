server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker internal DNS — resolve upstreams lazily (per-request) so nginx
    # starts successfully even if upstream containers are not yet running.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Proxy all /api calls to api-gateway
    # Docker Compose: api-gateway:9090
    # Kubernetes: api-gateway-service:9090 — override via ConfigMap in k8s story
    location /api/ {
        set $api_upstream http://api-gateway:9090;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket — routed via api-gateway (/ws/** → notification-service internally)
    location /ws/ {
        set $ws_upstream http://api-gateway:9090;
        proxy_pass $ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA fallback — all unknown routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
}